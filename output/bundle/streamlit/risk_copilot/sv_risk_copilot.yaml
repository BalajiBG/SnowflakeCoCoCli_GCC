name: SV_RISK_COPILOT
description: >
  Banking risk and compliance semantic model covering AML/fraud detection,
  credit risk, liquidity monitoring, and regulatory reporting for NBFC and
  banking teams.

tables:
  - name: CUSTOMERS
    base_table:
      database: RISK_COPILOT_DB
      schema: RISK_COPILOT
      table: CUSTOMERS
    description: Bank customers with KYC risk profiles, PEP status, and sanctions screening results.
    dimensions:
      - name: CUSTOMER_ID
        expr: CUSTOMER_ID
        description: Unique customer identifier
        unique: true
      - name: FULL_NAME
        expr: FULL_NAME
        description: Customer full name
      - name: CUSTOMER_TYPE
        expr: CUSTOMER_TYPE
        description: "Type of customer: INDIVIDUAL, CORPORATE, or HNI"
      - name: KYC_RISK_TIER
        expr: KYC_RISK_TIER
        description: "KYC assessed risk tier: LOW, MEDIUM, HIGH, VERY_HIGH"
      - name: IS_PEP
        expr: IS_PEP
        description: Whether customer is a Politically Exposed Person (TRUE/FALSE)
      - name: JURISDICTION
        expr: JURISDICTION
        description: Customer primary jurisdiction or city
      - name: OCCUPATION
        expr: OCCUPATION
        description: Customer declared occupation
      - name: SOURCE_OF_FUNDS
        expr: SOURCE_OF_FUNDS
        description: Declared source of funds for KYC
      - name: SANCTIONS_MATCH
        expr: SANCTIONS_MATCH
        description: Whether customer matches any international sanctions list
      - name: ADVERSE_MEDIA_FLAG
        expr: ADVERSE_MEDIA_FLAG
        description: Whether adverse media screening found negative coverage
    time_dimensions:
      - name: ONBOARDING_DATE
        expr: ONBOARDING_DATE
        description: Date the customer was onboarded
        data_type: DATE
      - name: LAST_KYC_REVIEW
        expr: LAST_KYC_REVIEW
        description: Date of last KYC review
        data_type: DATE
    measures:
      - name: CUSTOMER_COUNT
        expr: CUSTOMER_ID
        description: Count of customers
        aggregation: count_distinct
      - name: TOTAL_ANNUAL_INCOME
        expr: ANNUAL_INCOME
        description: Sum of declared annual income across customers
        aggregation: sum
      - name: PEP_COUNT
        expr: "CASE WHEN IS_PEP THEN 1 ELSE 0 END"
        description: Count of PEP customers
        aggregation: sum
      - name: HIGH_RISK_CUSTOMER_COUNT
        expr: "CASE WHEN KYC_RISK_TIER IN ('HIGH','VERY_HIGH') THEN 1 ELSE 0 END"
        description: Count of customers rated HIGH or VERY_HIGH risk
        aggregation: sum

  - name: ACCOUNTS
    base_table:
      database: RISK_COPILOT_DB
      schema: RISK_COPILOT
      table: ACCOUNTS
    description: Bank accounts with balances, credit limits, and NPA classification status.
    dimensions:
      - name: ACCOUNT_ID
        expr: ACCOUNT_ID
        description: Unique account identifier
        unique: true
      - name: CUSTOMER_ID
        expr: CUSTOMER_ID
        description: Owning customer ID (FK to CUSTOMERS)
      - name: ACCOUNT_TYPE
        expr: ACCOUNT_TYPE
        description: "Account type: SAVINGS, CURRENT, FIXED_DEPOSIT, TRADE_FINANCE, NOSTRO"
      - name: CURRENCY
        expr: CURRENCY
        description: Account currency (INR, USD)
      - name: ACCOUNT_STATUS
        expr: ACCOUNT_STATUS
        description: Account status (ACTIVE, DORMANT, CLOSED)
      - name: NPA_STATUS
        expr: NPA_STATUS
        description: "NPA classification: STANDARD, SUBSTANDARD, DOUBTFUL, LOSS"
      - name: BRANCH_CODE
        expr: BRANCH_CODE
        description: Branch code where account is held
      - name: IS_DORMANT
        expr: IS_DORMANT
        description: Whether the account is dormant
    time_dimensions:
      - name: OPENED_DATE
        expr: OPENED_DATE
        description: Date the account was opened
        data_type: DATE
    measures:
      - name: ACCOUNT_COUNT
        expr: ACCOUNT_ID
        description: Count of accounts
        aggregation: count_distinct
      - name: TOTAL_BALANCE
        expr: CURRENT_BALANCE
        description: Sum of current account balances
        aggregation: sum
      - name: TOTAL_CREDIT_LIMIT
        expr: CREDIT_LIMIT
        description: Sum of sanctioned credit limits
        aggregation: sum
      - name: AVG_BALANCE
        expr: CURRENT_BALANCE
        description: Average account balance
        aggregation: avg
      - name: NPA_ACCOUNT_COUNT
        expr: "CASE WHEN NPA_STATUS != 'STANDARD' THEN 1 ELSE 0 END"
        description: Count of accounts classified as NPA
        aggregation: sum

  - name: TRANSACTIONS
    base_table:
      database: RISK_COPILOT_DB
      schema: RISK_COPILOT
      table: TRANSACTIONS
    description: All financial transactions with risk scores, counterparty details, and cash indicators.
    dimensions:
      - name: TXN_ID
        expr: TXN_ID
        description: Unique transaction identifier
        unique: true
      - name: ACCOUNT_ID
        expr: ACCOUNT_ID
        description: Account that originated or received the transaction
      - name: TXN_TYPE
        expr: TXN_TYPE
        description: "Transaction type: CASH_DEPOSIT, WIRE_TRANSFER, WIRE_INCOMING, UPI_TRANSFER, EMI_DEBIT, CHEQUE_BOUNCE, SALARY_CREDIT, etc."
      - name: CURRENCY
        expr: CURRENCY
        description: Transaction currency (INR, USD)
      - name: COUNTERPARTY_NAME
        expr: COUNTERPARTY_NAME
        description: Name of the counterparty entity
      - name: COUNTERPARTY_COUNTRY
        expr: COUNTERPARTY_COUNTRY
        description: Country of the counterparty
      - name: CHANNEL
        expr: CHANNEL
        description: "Transaction channel: BRANCH, ONLINE, SWIFT, UPI, RTGS, NEFT, NACH"
      - name: PURPOSE
        expr: PURPOSE
        description: Declared purpose of the transaction
      - name: IS_CASH
        expr: IS_CASH
        description: Whether this is a cash transaction (relevant for CTR reporting threshold of INR 10 lakh)
    time_dimensions:
      - name: TXN_DATE
        expr: TXN_DATE
        description: Date and time of the transaction
        data_type: TIMESTAMP
    measures:
      - name: TRANSACTION_COUNT
        expr: TXN_ID
        description: Count of transactions
        aggregation: count_distinct
      - name: TOTAL_AMOUNT
        expr: AMOUNT
        description: Sum of transaction amounts
        aggregation: sum
      - name: AVG_AMOUNT
        expr: AMOUNT
        description: Average transaction amount
        aggregation: avg
      - name: MAX_AMOUNT
        expr: AMOUNT
        description: Maximum single transaction amount
        aggregation: max
      - name: AVG_RISK_SCORE
        expr: RISK_SCORE
        description: Average risk score of transactions (0-100 scale)
        aggregation: avg
      - name: MAX_RISK_SCORE
        expr: RISK_SCORE
        description: Highest risk score among transactions
        aggregation: max
      - name: CASH_TRANSACTION_COUNT
        expr: "CASE WHEN IS_CASH THEN 1 ELSE 0 END"
        description: Count of cash transactions (relevant for CTR reporting)
        aggregation: sum
      - name: CROSS_BORDER_COUNT
        expr: "CASE WHEN COUNTERPARTY_COUNTRY IS NOT NULL AND COUNTERPARTY_COUNTRY != 'India' THEN 1 ELSE 0 END"
        description: Count of cross-border transactions
        aggregation: sum

  - name: ALERTS
    base_table:
      database: RISK_COPILOT_DB
      schema: RISK_COPILOT
      table: ALERTS
    description: Risk and compliance alerts from monitoring systems covering AML, credit, liquidity, and fraud categories.
    dimensions:
      - name: ALERT_ID
        expr: ALERT_ID
        description: Unique alert identifier
        unique: true
      - name: CUSTOMER_ID
        expr: CUSTOMER_ID
        description: Customer the alert relates to
      - name: ACCOUNT_ID
        expr: ACCOUNT_ID
        description: Account the alert relates to
      - name: ALERT_TYPE
        expr: ALERT_TYPE
        description: "Specific alert type: STRUCTURING, ROUND_TRIPPING, RAPID_MOVEMENT, PEP_UNUSUAL_ACTIVITY, CONSECUTIVE_BOUNCES, LIQUIDITY_STRESS, TRADE_MISPRICING, HAWALA_INDICATORS"
      - name: ALERT_CATEGORY
        expr: ALERT_CATEGORY
        description: "Alert category: AML, CREDIT, LIQUIDITY, FRAUD"
      - name: SEVERITY
        expr: SEVERITY
        description: "Alert severity: LOW, MEDIUM, HIGH, CRITICAL"
      - name: STATUS
        expr: STATUS
        description: "Current status: OPEN, UNDER_REVIEW, ESCALATED, CLOSED"
      - name: DESCRIPTION
        expr: DESCRIPTION
        description: Detailed description of alert and trigger reason
      - name: EVIDENCE_SUMMARY
        expr: EVIDENCE_SUMMARY
        description: Summary of evidence supporting the alert
      - name: ASSIGNED_TO
        expr: ASSIGNED_TO
        description: Team or person the alert is assigned to
    time_dimensions:
      - name: ALERT_DATE
        expr: ALERT_DATE
        description: When the alert was generated
        data_type: TIMESTAMP
      - name: RESOLVED_DATE
        expr: RESOLVED_DATE
        description: When the alert was resolved (null if still open)
        data_type: TIMESTAMP
    measures:
      - name: ALERT_COUNT
        expr: ALERT_ID
        description: Count of alerts
        aggregation: count_distinct
      - name: CRITICAL_ALERT_COUNT
        expr: "CASE WHEN SEVERITY = 'CRITICAL' THEN 1 ELSE 0 END"
        description: Count of critical severity alerts
        aggregation: sum
      - name: OPEN_ALERT_COUNT
        expr: "CASE WHEN STATUS = 'OPEN' THEN 1 ELSE 0 END"
        description: Count of open (unresolved) alerts
        aggregation: sum

relationships:
  - left_table: ACCOUNTS
    right_table: CUSTOMERS
    join_type: many_to_one
    relationship_columns:
      - left_column: CUSTOMER_ID
        right_column: CUSTOMER_ID
  - left_table: TRANSACTIONS
    right_table: ACCOUNTS
    join_type: many_to_one
    relationship_columns:
      - left_column: ACCOUNT_ID
        right_column: ACCOUNT_ID
  - left_table: ALERTS
    right_table: CUSTOMERS
    join_type: many_to_one
    relationship_columns:
      - left_column: CUSTOMER_ID
        right_column: CUSTOMER_ID

